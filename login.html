<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ORST</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f4; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2>Login ORST</h2>
    <input type="email" id="email" placeholder="E-mail">
    <input type="password" id="pass" placeholder="Senha">
    <button onclick="fazerLogin(document.getElementById('email').value, document.getElementById('pass').value)">Entrar</button>
    <p style="font-size: 12px; margin-top: 15px; color: #666;">Se não tiver conta, use o e-mail cadastrado no Firebase.</p>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
